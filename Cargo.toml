[package]
name = "glint"
version = "0.1.0"
edition = "2024"
description = "Fast, elegant image viewer for sprites and screenshots"
build = "build.rs"

[lib]
name = "glint"
path = "src/lib.rs"

# Console front-end: CLI, headless ops, talks to the viewer over a named pipe.
[[bin]]
name = "glint"
path = "src/main.rs"

# GUI front-end (windows subsystem, no console flash). File associations point here.
[[bin]]
name = "glintw"
path = "src/gui_main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
asefile = "0.3.8"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37.0"
image = "0.25.10"
notify = "8.2.0"
raw-window-handle = "0.6.2"
resvg = "0.48.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Decoders are unbearably slow unoptimized; keep deps fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
